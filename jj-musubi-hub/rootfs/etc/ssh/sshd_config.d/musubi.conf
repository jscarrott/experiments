# Only the musubi user, only with keys. Keys come from two files: the ones listed in the
# add-on's options (rewritten at every start), and the one musubi itself appends to when a
# machine first joins (kept in /data).
AllowUsers musubi
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AuthorizedKeysFile /run/musubi/authorized_keys .ssh/authorized_keys
HostKey /data/ssh/ssh_host_ed25519_key
HostKey /data/ssh/ssh_host_rsa_key
AllowTcpForwarding no
AllowAgentForwarding no
AllowStreamLocalForwarding no
X11Forwarding no
PermitTunnel no
