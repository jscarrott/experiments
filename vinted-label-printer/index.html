<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0b6e69" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>Label Printer</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='7' y='3' width='18' height='26' rx='2' fill='%23fff' stroke='%23111' stroke-width='2'/%3E%3Cpath d='M11 9h10M11 13h6' stroke='%23111' stroke-width='2'/%3E%3Cpath d='M11 18v6M13 18v6M16 18v6M18 18v6M21 18v6' stroke='%23111' stroke-width='1.5'/%3E%3C/svg%3E" />
  </head>
  <body>
    <header class="top">
      <h1>Label Printer</h1>
      <p class="tagline">Vinted labels in, cropped and packed onto A4 or 4×6. Nothing leaves this browser.</p>
    </header>

    <main class="layout">
      <section class="intake" aria-label="Add labels">
        <label class="drop" id="drop">
          <input type="file" id="files" accept="application/pdf,.pdf,image/*" multiple hidden />
          <strong>Drop label PDFs here</strong>
          <span>or click to choose files. Images and pasted screenshots work too. Installed on Android, share label PDFs straight to this app.</span>
        </label>

        <details class="panel">
          <summary>QR code label</summary>
          <form id="qr-form" class="stack">
            <label>Code or link <textarea name="content" rows="2" required></textarea></label>
            <label>Caption (optional) <input name="caption" type="text" maxlength="80" placeholder="e.g. order number" /></label>
            <button type="submit">Add QR label</button>
          </form>
        </details>

        <details class="panel" id="settings-panel" open>
          <summary>Label settings</summary>
          <form id="settings" class="stack">
            <label>Print on <select name="output"></select></label>
            <label data-for="sheet">Start at <select name="startAt"></select></label>
            <label data-for="label">Label size <select name="sizeId"></select></label>
            <label>Margin <span class="inline"><input name="marginMm" type="number" min="0" max="15" step="0.5" /> mm</span></label>
            <label>Print resolution
              <select name="dpi">
                <option value="203">203 DPI (most thermal printers)</option>
                <option value="300">300 DPI (home printers)</option>
              </select>
            </label>
            <label class="check"><input name="rotate" type="checkbox" /> Turn landscape labels to fit</label>
            <label class="check"><input name="monochrome" type="checkbox" /> Pure black and white (sharper barcodes)</label>
            <label class="check" data-for="sheet"><input name="cutGuides" type="checkbox" /> Cut guides between labels</label>
            <p class="hint" data-for="sheet">Print at 100% / actual size, not “fit to page”, so labels line up with sticker sheets.</p>
          </form>
        </details>
      </section>

      <section class="queue" aria-label="Labels">
        <div class="queue-bar">
          <p id="summary" role="status" aria-live="polite">No labels yet.</p>
          <div class="queue-actions">
            <button type="button" id="clear" class="quiet" disabled>Clear</button>
            <button type="button" id="download" disabled>Download PDF</button>
            <button type="button" id="share" hidden disabled>Share</button>
            <button type="button" id="print" class="primary" disabled>Print</button>
          </div>
        </div>
        <p id="message" class="message" role="alert" hidden></p>
        <ol id="jobs" class="jobs"></ol>
      </section>
    </main>

    <dialog id="editor" aria-labelledby="editor-title">
      <div class="editor-head">
        <h2 class="editor-title" id="editor-title"></h2>
        <button type="button" class="quiet" data-action="close" aria-label="Close">✕</button>
      </div>
      <div class="editor-body">
        <div class="editor-stage"></div>
        <div class="editor-side">
          <div class="editor-result"></div>
          <div class="stack">
            <button type="button" data-action="auto">Auto-detect</button>
            <button type="button" data-action="whole">Whole page</button>
            <button type="button" data-action="save"></button>
            <button type="button" data-action="forget" class="quiet">Forget saved crop</button>
            <p class="editor-saved hint"></p>
            <button type="button" class="primary" data-action="close">Done</button>
          </div>
        </div>
      </div>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
