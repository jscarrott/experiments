server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # .mjs is the pdf.js worker; browsers refuse to start a module worker served as
  # application/octet-stream.
  include /etc/nginx/mime.types;
  types {
    text/javascript mjs;
  }

  # Nothing is fetched from anywhere but this site, and labels never go anywhere:
  # connect-src 'self' means a compromised script could not post one off-site either.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self'; frame-src 'self' blob: about:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self'; frame-src 'self' blob: about:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;
    add_header X-Content-Type-Options nosniff always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
