server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  include /etc/nginx/mime.types;
  types {
    # The pdf.js worker; browsers refuse a module worker served as octet-stream.
    text/javascript mjs;
    application/manifest+json webmanifest;
  }

  include /etc/nginx/snippets/security-headers.conf;

  # Hashed file names: safe to cache for ever.
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # The service worker and manifest must be re-checked on every load, or an installed
  # app can be stuck on an old version.
  location ~ ^/(sw\.js|manifest\.webmanifest)$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
