# Included in every location: nginx drops the server-level add_header lines in any
# location that sets headers of its own, so they live here instead.
#
# Nothing is fetched from anywhere but this site, and labels never go anywhere:
# connect-src 'self' means a compromised script could not post one off-site either.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'self'" always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;
